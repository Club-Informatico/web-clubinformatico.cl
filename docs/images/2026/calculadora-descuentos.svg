<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Calculadora de descuentos: precio original, descuento y precio final">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#5E3BEF"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF453A"/>
      <stop offset="1" stop-color="#FF9F0A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.08">
    <circle cx="80" cy="90" r="160"/>
    <circle cx="1150" cy="720" r="220"/>
    <circle cx="1080" cy="80" r="60"/>
  </g>
  <!-- Símbolos de porcentaje decorativos -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" fill="#ffffff" fill-opacity="0.12">
    <text x="90" y="700" font-size="140">%</text>
    <text x="1040" y="330" font-size="90">%</text>
    <text x="440" y="120" font-size="70">$</text>
  </g>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Título -->
    <text x="90" y="300" fill="#ffffff" font-size="64" font-weight="800">Calculadora</text>
    <text x="90" y="372" fill="#ffffff" font-size="64" font-weight="800">de descuentos</text>
    <text x="90" y="428" fill="#ffffff" fill-opacity="0.8" font-size="26">Saca la cuenta antes de pasar por caja</text>
    <!-- Badges -->
    <g font-size="20" font-weight="600">
      <rect x="90" y="470" width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.18"/>
      <text x="165" y="499" text-anchor="middle" fill="#ffffff">⚡ Al instante</text>
      <rect x="254" y="470" width="132" height="44" rx="22" fill="#ffffff" fill-opacity="0.18"/>
      <text x="320" y="499" text-anchor="middle" fill="#ffffff">📲 Instalable</text>
      <rect x="400" y="470" width="160" height="44" rx="22" fill="#ffffff" fill-opacity="0.18"/>
      <text x="480" y="499" text-anchor="middle" fill="#ffffff">📴 Sin internet</text>
    </g>

    <!-- Teléfono -->
    <g transform="translate(700 90)" filter="url(#shadow)">
      <rect width="330" height="640" rx="48" fill="#1c1c1e"/>
      <rect x="14" y="14" width="302" height="612" rx="36" fill="#f2f2f7"/>
      <rect x="120" y="28" width="90" height="24" rx="12" fill="#1c1c1e"/>

      <text x="165" y="118" text-anchor="middle" fill="#1c1c1e" font-size="24" font-weight="700">Calculadora de Descuentos</text>

      <text x="40" y="176" fill="#6e6e73" font-size="17">Precio Original</text>
      <rect x="36" y="188" width="258" height="58" rx="14" fill="#ffffff" stroke="#d1d1d6"/>
      <text x="56" y="226" fill="#1c1c1e" font-size="24">49990</text>

      <text x="40" y="290" fill="#6e6e73" font-size="17">Descuento (%)</text>
      <rect x="36" y="302" width="258" height="58" rx="14" fill="#ffffff" stroke="#0A84FF" stroke-width="2.5"/>
      <text x="56" y="340" fill="#1c1c1e" font-size="24">35</text>
      <rect x="84" y="318" width="2.5" height="28" fill="#0A84FF"/>

      <rect x="36" y="392" width="258" height="120" rx="18" fill="#0A84FF"/>
      <text x="165" y="432" text-anchor="middle" fill="#ffffff" fill-opacity="0.85" font-size="17">Precio con descuento</text>
      <text x="165" y="484" text-anchor="middle" fill="#ffffff" font-size="40" font-weight="800">$32.493,5</text>

      <rect x="115" y="596" width="100" height="6" rx="3" fill="#1c1c1e" fill-opacity="0.3"/>
    </g>

    <!-- Etiqueta de oferta -->
    <g transform="translate(640 170) rotate(-14)" filter="url(#shadow)">
      <path d="M0 0 H150 L190 50 L150 100 H0 Z" fill="url(#tag)"/>
      <circle cx="160" cy="50" r="9" fill="#ffffff" fill-opacity="0.9"/>
      <text x="72" y="66" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="800">-35%</text>
    </g>
  </g>
</svg>

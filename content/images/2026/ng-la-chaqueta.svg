<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="La Chaqueta: una leyenda de Copiapó, novela gráfica">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a1f"/>
      <stop offset="0.65" stop-color="#2a1838"/>
      <stop offset="1" stop-color="#3d1f2e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6e7c1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f6e7c1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jacketGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0283a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e0283a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6283a"/>
      <stop offset="1" stop-color="#8c1222"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbb8d6" stop-opacity="0"/>
      <stop offset="1" stop-color="#cbb8d6" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Cielo nocturno -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="90"  cy="70"  r="1.6" opacity="0.7"/>
    <circle cx="240" cy="40"  r="1.2" opacity="0.5"/>
    <circle cx="420" cy="90"  r="1.6" opacity="0.6"/>
    <circle cx="610" cy="35"  r="1.2" opacity="0.5"/>
    <circle cx="760" cy="80"  r="1.4" opacity="0.6"/>
    <circle cx="1120" cy="60" r="1.6" opacity="0.6"/>
    <circle cx="330" cy="170" r="1.2" opacity="0.4"/>
    <circle cx="1170" cy="200" r="1.2" opacity="0.4"/>
  </g>

  <!-- Luna -->
  <circle cx="960" cy="150" r="150" fill="url(#moonGlow)"/>
  <circle cx="960" cy="150" r="62" fill="#f6e7c1"/>
  <circle cx="940" cy="135" r="9" fill="#e6d3a6"/>
  <circle cx="978" cy="170" r="6" fill="#e6d3a6"/>

  <!-- Pimientos (siluetas de árboles) -->
  <g fill="#120c1c">
    <path d="M0 560 C20 470 70 420 140 430 C190 380 280 390 300 450 C350 440 380 490 360 540 C340 580 300 590 260 585 L250 640 L230 640 L228 590 C180 600 120 600 80 590 C40 600 0 590 0 560 Z"/>
    <path d="M1200 540 C1180 450 1110 410 1050 430 C1010 390 930 400 920 460 C880 460 860 510 885 550 C905 585 950 590 990 585 L1000 640 L1020 640 L1022 590 C1070 600 1130 595 1160 585 C1185 590 1200 570 1200 540 Z"/>
    <!-- Hojas colgantes -->
    <path d="M100 590 q5 30 0 50 M140 595 q6 34 0 56 M190 600 q4 28 0 46 M300 580 q5 26 0 44" stroke="#120c1c" stroke-width="4" fill="none"/>
    <path d="M940 585 q5 30 0 50 M1080 595 q6 34 0 56 M1130 590 q4 28 0 46" stroke="#120c1c" stroke-width="4" fill="none"/>
  </g>

  <!-- Farol -->
  <circle cx="345" cy="330" r="110" fill="url(#lampGlow)"/>
  <g fill="#120c1c">
    <rect x="340" y="335" width="10" height="320"/>
    <path d="M325 318 H365 L358 345 H332 Z"/>
    <rect x="330" y="310" width="30" height="8" rx="2"/>
  </g>
  <rect x="334" y="320" width="22" height="20" fill="#ffcf7a"/>

  <!-- Calle -->
  <rect x="0" y="640" width="1200" height="160" fill="#0d0915"/>
  <rect x="0" y="600" width="1200" height="60" fill="url(#fog)"/>
  <g fill="#3a2f45">
    <rect x="80"  y="712" width="110" height="8" rx="4"/>
    <rect x="300" y="712" width="110" height="8" rx="4"/>
    <rect x="790" y="712" width="110" height="8" rx="4"/>
    <rect x="1010" y="712" width="110" height="8" rx="4"/>
  </g>

  <!-- Taxi (silueta) -->
  <g transform="translate(836 590)">
    <path d="M0 110 L0 75 C0 62 10 55 24 52 L70 45 L110 8 C116 3 124 0 132 0 H230 C240 0 248 4 254 10 L290 45 L330 52 C346 55 356 64 356 78 V110 Z" fill="#2a2236" stroke="#4a3d5c" stroke-width="2"/>
    <!-- Letrero taxi -->
    <rect x="148" y="-26" width="62" height="24" rx="5" fill="#ffcc33"/>
    <text x="179" y="-8" text-anchor="middle" fill="#17111f" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800">TAXI</text>
    <!-- Ventanas -->
    <path d="M86 46 L118 14 H170 V46 Z" fill="#2e2440"/>
    <path d="M182 14 H234 L264 46 H182 Z" fill="#2e2440"/>
    <!-- Silueta en el asiento trasero (apenas visible) -->
    <path d="M205 46 C205 36 212 28 222 28 C232 28 238 36 238 46 Z" fill="#6b1420" opacity="0.8"/>
    <!-- Ruedas -->
    <circle cx="80"  cy="112" r="28" fill="#08060c"/>
    <circle cx="80"  cy="112" r="12" fill="#2e2440"/>
    <circle cx="280" cy="112" r="28" fill="#08060c"/>
    <circle cx="280" cy="112" r="12" fill="#2e2440"/>
    <!-- Luces -->
    <rect x="340" y="68" width="16" height="10" rx="3" fill="#ffe3a3"/>
    <rect x="0" y="70" width="10" height="10" rx="3" fill="#e0283a"/>
  </g>

  <!-- Chaqueta roja flotando -->
  <circle cx="600" cy="300" r="190" fill="url(#jacketGlow)"/>
  <g transform="translate(600 300)">
    <path d="M-40 -110 C-20 -92 20 -92 40 -110 L95 -90 C112 -84 122 -72 126 -54 L150 60 C152 72 144 80 132 80 L112 80 L100 0 L98 120 C98 128 92 134 84 134 H-84 C-92 134 -98 128 -98 120 L-100 0 L-112 80 L-132 80 C-144 80 -152 72 -150 60 L-126 -54 C-122 -72 -112 -84 -95 -90 Z" fill="url(#jacket)"/>
    <path d="M-40 -110 L0 -40 L40 -110" fill="none" stroke="#5e0c17" stroke-width="5" stroke-linejoin="round"/>
    <path d="M0 -40 V130" stroke="#5e0c17" stroke-width="4"/>
    <g fill="#f2d6a2">
      <circle cx="-12" cy="-10" r="5"/>
      <circle cx="-12" cy="30" r="5"/>
      <circle cx="-12" cy="70" r="5"/>
    </g>
    <path d="M-80 60 H-40 M40 60 H80" stroke="#5e0c17" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Reloj detenido -->
  <g transform="translate(120 120)" font-family="'Courier New', Consolas, monospace">
    <rect width="190" height="74" rx="12" fill="#08060c" stroke="#e0283a" stroke-opacity="0.6" stroke-width="2"/>
    <text x="95" y="51" text-anchor="middle" fill="#ff4d5e" font-size="42" font-weight="700" letter-spacing="3">23:47</text>
  </g>

  <!-- Título -->
  <g text-anchor="middle">
    <text x="600" y="545" fill="#f6e7c1" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" font-size="88" font-weight="700" letter-spacing="2">La Chaqueta</text>
    <text x="600" y="590" fill="#f6e7c1" fill-opacity="0.75" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" font-size="26" font-style="italic">Una leyenda de Copiapó</text>
  </g>
</svg>

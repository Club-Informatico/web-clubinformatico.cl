<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Temporizador para presentaciones: verde, amarillo y rojo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1f2e"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Luces difusas de fondo -->
  <g filter="url(#glow)" opacity="0.35">
    <circle cx="160"  cy="140" r="120" fill="#22c55e"/>
    <circle cx="1060" cy="140" r="120" fill="#ef4444"/>
    <circle cx="600"  cy="760" r="140" fill="#facc15"/>
  </g>

  <!-- Tres pantallas: verde, amarillo, rojo -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(110 150) rotate(-4)">
      <rect width="300" height="200" rx="22" fill="#22c55e"/>
      <text x="150" y="128" fill="#ffffff" font-size="82">15:00</text>
    </g>
    <g transform="translate(450 120)">
      <rect width="300" height="200" rx="22" fill="#facc15"/>
      <text x="150" y="128" fill="#111111" font-size="82">08:30</text>
    </g>
    <g transform="translate(790 130) rotate(4)">
      <rect width="300" height="200" rx="22" fill="#ef4444"/>
      <text x="150" y="128" fill="#ffffff" font-size="82">01:45</text>
    </g>
  </g>

  <!-- Semáforo -->
  <g transform="translate(600 430)">
    <rect x="-120" y="-36" width="240" height="72" rx="36" fill="#262a3d" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="-70" r="22" fill="#22c55e"/>
    <circle cx="0"   r="22" fill="#facc15"/>
    <circle cx="70"  r="22" fill="#ef4444"/>
  </g>

  <!-- Título -->
  <text x="600" y="580" text-anchor="middle" fill="#ffffff"
        font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800">Temporizador para presentaciones</text>
  <text x="600" y="630" text-anchor="middle" fill="#ffffff" fill-opacity="0.7"
        font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26">Controla tu tiempo de un vistazo</text>

  <!-- Barra de progreso en tres tercios -->
  <g transform="translate(300 680)">
    <rect width="600" height="14" rx="7" fill="#ffffff" fill-opacity="0.1"/>
    <rect width="200" height="14" rx="7" fill="#22c55e"/>
    <rect x="200" width="200" height="14" fill="#facc15"/>
    <rect x="400" width="110" height="14" fill="#ef4444"/>
    <circle cx="510" cy="7" r="12" fill="#ffffff"/>
  </g>
</svg>

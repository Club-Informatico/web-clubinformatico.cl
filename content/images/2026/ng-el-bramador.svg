<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="El Bramador: una leyenda de Copiapó, novela gráfica">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1230"/>
      <stop offset="0.55" stop-color="#2b2347"/>
      <stop offset="1" stop-color="#6b3d3a"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98d52"/>
      <stop offset="1" stop-color="#6e4227"/>
    </linearGradient>
    <linearGradient id="duneShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2a1a" stop-opacity="0"/>
      <stop offset="1" stop-color="#4a2a1a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="1" stop-color="#140c08"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1cf" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff1cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cielo -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="80"  cy="60"  r="1.6" opacity="0.7"/>
    <circle cx="210" cy="120" r="1.2" opacity="0.5"/>
    <circle cx="360" cy="45"  r="1.6" opacity="0.6"/>
    <circle cx="520" cy="100" r="1.2" opacity="0.5"/>
    <circle cx="700" cy="30"  r="1.4" opacity="0.6"/>
    <circle cx="1130" cy="90" r="1.6" opacity="0.6"/>
    <circle cx="1040" cy="40" r="1.2" opacity="0.5"/>
    <circle cx="150" cy="210" r="1.2" opacity="0.4"/>
  </g>

  <!-- Luna -->
  <circle cx="210" cy="170" r="140" fill="url(#moonGlow)"/>
  <circle cx="210" cy="170" r="54" fill="#fff1cf"/>

  <!-- Ondas del bramido -->
  <g fill="none" stroke="#ffcf8a" stroke-linecap="round">
    <path d="M520 250 A260 170 0 0 1 1080 250" stroke-opacity="0.55" stroke-width="5"/>
    <path d="M460 215 A330 215 0 0 1 1140 215" stroke-opacity="0.35" stroke-width="4"/>
    <path d="M400 180 A400 260 0 0 1 1200 180" stroke-opacity="0.18" stroke-width="3"/>
  </g>

  <!-- Cerro Bramador (duna) -->
  <path d="M380 560 C520 470 640 300 800 285 C940 275 1080 420 1200 470 V600 H380 Z" fill="url(#dune)"/>
  <path d="M800 285 C900 300 1000 380 1080 440 C1120 470 1170 480 1200 490 V600 H880 C860 470 830 360 800 285 Z" fill="url(#duneShade)"/>
  <!-- Ondulaciones de arena -->
  <g fill="none" stroke="#e6b57c" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <path d="M560 470 C620 450 680 445 740 455"/>
    <path d="M600 520 C680 500 760 498 840 510"/>
    <path d="M700 380 C740 365 780 362 820 368"/>
  </g>

  <!-- Cerros lejanos -->
  <path d="M0 560 C80 520 160 500 240 515 C320 530 360 545 420 560 V600 H0 Z" fill="#3d2a33"/>

  <!-- Suelo -->
  <rect x="0" y="590" width="1200" height="210" fill="url(#ground)"/>

  <!-- Fogata -->
  <circle cx="330" cy="660" r="140" fill="url(#fireGlow)"/>
  <g transform="translate(330 680)">
    <path d="M-40 10 L40 -6 M-40 -6 L40 10" stroke="#2a1a10" stroke-width="10" stroke-linecap="round"/>
    <path d="M0 -70 C18 -48 26 -30 20 -12 C16 0 6 6 0 6 C-6 6 -16 0 -20 -12 C-26 -30 -12 -46 0 -70 Z" fill="#ff7a1a"/>
    <path d="M0 -44 C10 -32 12 -20 8 -10 C5 -3 2 0 0 0 C-2 0 -5 -3 -8 -10 C-12 -20 -8 -30 0 -44 Z" fill="#ffd36b"/>
  </g>

  <!-- Cateador (silueta, izquierda de la fogata) -->
  <g fill="#0e0806" transform="translate(205 590)">
    <path d="M-30 18 C-30 8 -20 0 0 0 C20 0 30 8 30 18 Z"/>
    <rect x="-38" y="14" width="76" height="8" rx="4"/>
    <circle cx="0" cy="34" r="16"/>
    <path d="M-30 120 L-24 58 C-22 50 -14 46 0 46 C14 46 22 50 24 58 L30 120 Z"/>
    <path d="M24 60 L70 30" stroke="#0e0806" stroke-width="6" stroke-linecap="round"/>
    <path d="M58 22 L86 40" stroke="#0e0806" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Forastero (silueta con sombrero de copa, derecha de la fogata) -->
  <g fill="#0e0806" transform="translate(460 560)">
    <rect x="-16" y="0" width="32" height="38" rx="3"/>
    <rect x="-28" y="34" width="56" height="7" rx="3"/>
    <circle cx="0" cy="58" r="16"/>
    <path d="M-34 160 L-28 84 C-26 76 -16 72 0 72 C16 72 26 76 28 84 L34 160 Z"/>
  </g>
  <!-- Ojos del forastero -->
  <g fill="#ff4d3a">
    <circle cx="455" cy="616" r="2.5"/>
    <circle cx="465" cy="616" r="2.5"/>
  </g>

  <!-- Título -->
  <g text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif">
    <text x="830" y="690" fill="#fff1cf" font-size="92" font-weight="700" letter-spacing="2">El Bramador</text>
    <text x="830" y="738" fill="#fff1cf" fill-opacity="0.75" font-size="26" font-style="italic">Una leyenda de Copiapó · 1839</text>
  </g>
</svg>
